#cloud-config
autoinstall:
  version: 1
  locale: en_GB.UTF-8

  keyboard:
    layout: gb

  identity:
    hostname: ubuntu-2604
    username: petru
    password: "$6$somesalt$EUZ8kwCc9ep8lwTsoHcm8wXYMdLqh3YAtp4ktYpdUUOcyADb2reM98LiO4Pcx2IDmtcop411xXuTyswFdy5nG/"

  ssh:
    install-server: true
    allow-pw: true

  storage:
    layout:
      name: direct

  network:
    version: 2
    ethernets:
      ens18:                 # ✅ Correct for most Proxmox VMs (VirtIO NIC)
        dhcp4: false
        addresses:
          - 172.16.10.150/24
        gateway4: 172.16.10.1
        nameservers:
          addresses:
            - 8.8.8.8
            - 1.1.1.1

  packages:
    - vim
    - curl
    - git

  late-commands:
    - curtin in-target -- apt update
    - curtin in-target -- systemctl enable ssh